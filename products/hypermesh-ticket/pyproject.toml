[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hypermesh-ticket"
version = "0.1.0"
requires-python = ">=3.13"
description = "Versioned Hypermesh family lease ticket protocol"
dependencies = ["controlplane-identity"]

[tool.uv.sources]
controlplane-identity = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.4.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/hypermesh_ticket"]

[tool.pytest.ini_options]
testpaths = ["tests"]
