[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hypermesh-ticket"
version = "0.1.0"
requires-python = ">=3.13"
description = "Versioned Hypermesh family lease ticket protocol"
dependencies = ["controlplane-identity @ git+https://github.com/hyperme-sh/controlplane-identity.git@13a8257be7762f5e35af63e49136e943a990535c"]

[dependency-groups]
dev = ["pytest>=8.4.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/hypermesh_ticket"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/contracts", "/docs", "/integration", "/edge-routes.json", "/pyproject.toml", "/uv.lock", "/README.md"]
