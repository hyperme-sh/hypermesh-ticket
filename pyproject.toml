[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hypermesh-ticket"
version = "0.1.0"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Versioned Hypermesh family lease ticket protocol"
dependencies = ["controlplane-identity @ git+https://github.com/hyperme-sh/controlplane-identity.git@5aeff3d2c00568f39ca6e8b75c7e63883d3a510b"]

[dependency-groups]
dev = ["pytest>=8.4.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/hypermesh_ticket"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
include = ["/LICENSE", "/src", "/tests", "/scripts", "/contracts", "/docs", "/integration", "/edge-routes.json", "/pyproject.toml", "/uv.lock", "/README.md"]
